<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B1A">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D1420">
<meta name="description" content="Modo Emprendedor — Aprende. Construye. Vende. Una misión al día para pasar de una idea a un negocio real.">
<title>Modo Emprendedor · Aprende. Construye. Vende.</title>

<!-- El naranja del arranque, en el primer frame.

     Va en línea y antes que cualquier <link> a propósito. Una hoja externa
     bloquea el pintado, sí, pero primero tiene que llegar por la red, y es en
     ese hueco —milisegundos en fibra, medio segundo en una red mala— donde
     el navegador enseñaba su lienzo blanco. Escrito aquí dentro, el color
     viaja en el mismo HTML y no hay hueco que llenar.

     .app-lista la pone js/core/splash.js cuando la pantalla de arranque
     termina, y devuelve el mando al fondo normal de la app: con el <html>
     transparente, el navegador usa el fondo del <body>. Las dos reglas viven
     en el mismo bloque para que la segunda gane por especificidad sin
     depender de en qué orden acaben cargando las hojas de css/.

     La regla de .arranque es un seguro: si css/splash.css no llegara, el
     arranque seguiría siendo una pantalla naranja completa en vez de un
     dibujo suelto sobre la app a medio pintar. -->
<style>
  html { background: #FF6B1A; }
  html.app-lista { background: transparent; }
  .arranque { position: fixed; inset: 0; z-index: 10000; background: #FF6B1A; }
</style>

<!-- Vista previa al compartir el enlace.
     og:image tiene que ser absoluta: WhatsApp y Facebook no resuelven rutas
     relativas cuando raspan la página. -->

<meta property="og:site_name" content="Modo Emprendedor">
<meta property="og:locale" content="es_MX">
<meta property="og:url" content="https://erickzoneee.github.io/modo-emprendedor/">

<meta property="og:image" content="https://erickzoneee.github.io/modo-emprendedor/assets/og-image.png">
<meta property="og:image:secure_url" content="https://erickzoneee.github.io/modo-emprendedor/assets/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">

<meta property="og:image:alt" content="Modo Emprendedor — Aprende. Construye. Vende. Una misión al día para pasar de una idea a un negocio real.">

<meta name="twitter:image" content="https://erickzoneee.github.io/modo-emprendedor/assets/og-image.png">

<!-- App instalable -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">

<!-- La tipografía viaja con la app: sin esto, sin conexión se dibujaba con otra fuente -->
<link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

<link rel="stylesheet" href="css/fonts.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/iconos.css">
<!-- La Plaza trae su propio lugar y su propia familia de color (--pz-*). Va
     antes que temas.css a propósito: los toldos de los puestos ajenos no
     deben poder ganarle al cortafuegos que apaga --neg-* dentro de ellos. -->
<link rel="stylesheet" href="css/plaza.css">
<!-- Va el último a propósito: sus reglas tienen la misma especificidad que las
     que sobrescribe, así que quien decide es el orden de la cascada. -->
<link rel="stylesheet" href="css/temas.css">
<!-- La pantalla de arranque va después de temas.css porque no debe heredar
     los colores del negocio de cada usuario: el arranque es de EMPRENDO. -->
<link rel="stylesheet" href="css/splash.css">
</head>
<body>

<!-- ============ Arranque visual ============

     Estos dos van antes que todo lo demás, y en este orden.

     brand.js trae el logotipo y las claves de almacenamiento; splash.js se
     pinta a sí mismo de forma síncrona, antes de que el navegador llegue
     siquiera a parsear el caparazón de aquí abajo. Bajarlos al bloque de
     núcleo devuelve el destello blanco que vinieron a quitar: para entonces
     el caparazón vacío ya tuvo tiempo de pintarse. -->
<script src="js/data/brand.js"></script>
<!-- mascot.js va aquí y no en el bloque de núcleo: el retrato del arranque
     toma de él la silueta de Chispa, para que no puedan separarse. No
     depende de nada más que de window. -->
<script src="js/core/mascot.js"></script>
<script src="js/core/splash.js"></script>

<!-- Marco tipo teléfono en escritorio -->
<div class="stage">
  <div class="stage__glow stage__glow--a"></div>
  <div class="stage__glow stage__glow--b"></div>

  <div class="phone" id="phone">
    <!-- Barra superior con métricas -->
    <header class="topbar" id="topbar" hidden></header>

    <!-- Contenido de la pantalla activa -->
    <main class="viewport" id="view"></main>

    <!-- Navegación inferior -->
    <nav class="tabbar" id="tabbar" hidden></nav>
  </div>
</div>

<!-- Capas globales -->
<canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>
<div id="toast-layer" class="toast-layer" aria-live="polite"></div>
<div id="modal-layer" class="modal-layer" hidden></div>
<div id="sheet-layer" class="sheet-layer" hidden></div>

<!-- ============ Núcleo ============
     js/data/brand.js ya se cargó arriba, con la pantalla de arranque: Store
     lee de él su clave de almacenamiento, y el service worker se trae ese
     mismo archivo con importScripts. -->
<script src="js/core/store.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/fx.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/speech.js"></script>
<!-- La promesa "Tu idea es tuya": un modal, no una pantalla, así que vive en el
     núcleo. Solo necesita UI, Store y Mascot, y los tres están ya cargados. -->
<script src="js/core/promesa.js"></script>

<!-- ============ Datos ============ -->
<!-- El alfabeto visual. Va el primero de los datos porque no depende de
     ninguno, y porque js/core/iconos.js —dos bloques más abajo— no puede
     cargarse sin él. -->
<script src="js/data/iconos.js"></script>
<script src="js/data/config.js"></script>
<script src="js/data/lessons-1.js"></script>
<script src="js/data/lessons-2.js"></script>
<script src="js/data/lessons-3.js"></script>
<script src="js/data/lessons-4.js"></script>
<script src="js/data/lessons-5.js"></script>
<script src="js/data/lessons-6.js"></script>
<script src="js/data/lessons-7.js"></script>
<script src="js/data/lessons-8.js"></script>
<script src="js/data/sim.js"></script>
<script src="js/data/mentor-kb.js"></script>
<script src="js/data/venture-templates.js"></script>
<script src="js/data/mascota-capas.js"></script>
<script src="js/data/logros-compartibles.js"></script>
<script src="js/data/kb.js"></script>

<!-- ============ Motor ============
     iconos.js abre el bloque porque necesita a js/data/iconos.js, que acaba de
     cargarse, y porque a partir de aquí ya hay pantallas que pintar. Se engancha
     solo a las capas del caparazón y no lo llama nadie: cada emoji que aparezca
     en pantalla, desde este punto, sale dibujado.

     venture.js va antes que ai.js y personalize.js: es la fuente de contexto
     que ambos consultan. personalize.js lee las plantillas al cargarse. -->
<script src="js/core/iconos.js"></script>
<script src="js/core/venture.js"></script>
<script src="js/core/ai-worker.js"></script>
<script src="js/core/local-ai.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/core/personalize.js"></script>
<!-- persona.js lee CONFIG y Venture, y lo leen las pantallas: por eso va
     después del motor y antes de ellas. mascot.js se carga mucho antes, así
     que lo consulta de forma perezosa dentro de svg(). -->
<script src="js/core/persona.js"></script>
<script src="js/core/chispa.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/mentor.js"></script>
<!-- Lee del perfil y no escribe en él: escribir subiría venture.rev y
     tiraría la caché de desafíos personalizados. -->
<script src="js/core/comparte.js"></script>
<!-- La vitrina de la Plaza. Lee de Venture y del expediente, igual que
     comparte.js, y como él tampoco escribe en el perfil. -->
<script src="js/core/plaza.js"></script>
<!-- El motor de las razones. Va detrás de plaza.js porque trabaja sobre las
     vitrinas que aquel construye, y no lo llama nadie hasta que haya vecinos. -->
<script src="js/core/plaza-motor.js"></script>
<!-- Lo unico de la app que habla con un servidor sobre datos de personas.
     Va detras de plaza.js porque le pide la sesion y la lista blanca. -->
<script src="js/core/plaza-nube.js"></script>

<!-- ============ Pantallas ============ -->
<script src="js/screens/onboarding.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/lesson.js"></script>
<script src="js/screens/mission.js"></script>
<script src="js/screens/simulator.js"></script>
<script src="js/screens/mentor.js"></script>
<script src="js/screens/business.js"></script>
<script src="js/screens/venture.js"></script>
<script src="js/screens/personaliza.js"></script>
<script src="js/screens/comparte.js"></script>
<script src="js/screens/plaza.js"></script>
<script src="js/screens/profile.js"></script>
<script src="js/screens/league.js"></script>
<script src="js/screens/shop.js"></script>

<!-- ============ Arranque ============ -->
<script src="js/app.js"></script>
</body>
</html>
